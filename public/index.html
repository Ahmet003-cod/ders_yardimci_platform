<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFlow</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1b2a25;--mut:#6b7a74;--acc:#2f6f5e;--line:#dde4e0;--warn:#b4462f}
[data-theme=dark]{--bg:#121917;--card:#1b2522;--ink:#e6efeb;--mut:#8fa39b;--acc:#5fb59d;--line:#2a3833}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin:3px 0 10px}
button{background:var(--acc);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}button.g{background:none;color:var(--acc);border:1px solid var(--line)}button.d{background:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#auth{max-width:380px;margin:8vh auto;padding:24px}#app{display:none;min-height:100vh}
nav{position:fixed;inset:0 auto 0 0;width:190px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px}
nav h1{font-size:20px;margin:0 8px 16px;color:var(--acc)}nav a{display:block;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}nav a.on{background:var(--acc);color:#fff}
main{margin-left:190px;padding:20px 24px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.big{font-size:28px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.err{color:var(--warn);min-height:20px}.mut{color:var(--mut)}.done{text-decoration:line-through;opacity:.6}.tm{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:700px){nav{position:static;width:auto;display:flex;overflow:auto}nav h1{display:none}main{margin:0;padding:12px}}
</style></head><body>
<div id="auth"><h1 style="color:var(--acc)">StudyFlow</h1><div class="box"><div id="lf">
<label>Kullanıcı adı veya e-posta<input id="l1" autocomplete="username"></label><label>Şifre<input id="l2" type="password" autocomplete="current-password"></label>
<div class="err" id="le"></div><button onclick="login()">Giriş yap</button> <button class="g" onclick="sw(1)">Hesap oluştur</button></div>
<div id="rf" hidden><label>Ad soyad<input id="r1"></label><label>Kullanıcı adı<input id="r2"></label><label>E-posta<input id="r3" type="email"></label><label>Şifre (8+, büyük/küçük harf, rakam)<input id="r4" type="password"></label><label>Şifre tekrar<input id="r5" type="password"></label>
<div class="err" id="re"></div><button onclick="reg()">Kayıt ol</button> <button class="g" onclick="sw(0)">Girişe dön</button></div></div></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),api=async(m,u,b)=>{const r=await fetch('/api'+u,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Hata');return j};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} sa ${m} dk`:`${m} dk`},td=()=>new Date().toLocaleDateString('sv');
let U,courses=[],page='dash',charts=[],tick;
function sw(x){$('#lf').hidden=!!x;$('#rf').hidden=!x}
async function login(){try{await api('POST','/login',{login:$('#l1').value,password:$('#l2').value});boot()}catch(e){$('#le').textContent=e.message}}
async function reg(){try{await api('POST','/register',{full_name:$('#r1').value,username:$('#r2').value,email:$('#r3').value,password:$('#r4').value,password2:$('#r5').value});boot()}catch(e){$('#re').textContent=e.message}}
async function boot(){try{U=await api('GET','/me')}catch{return}document.documentElement.dataset.theme=U.theme;$('#auth').style.display='none';$('#app').style.display='block';
 $('#nav').innerHTML='<h1>StudyFlow</h1>'+[['dash','Panel'],['courses','Dersler'],['plan','Program'],['notes','Notlar'],['timer','Zamanlayıcı'],['goals','Hedefler ve görevler'],['stats','İstatistik'],['prof','Profil']].map(([k,t])=>`<a data-p="${k}" tabindex=0 onclick="go('${k}')">${t}</a>`).join('');go(page)}
async function go(p){page=p;clearInterval(tick);charts.forEach(c=>c.destroy());charts=[];if(p==='courses'||!courses.length)courses=await api('GET','/courses');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));await views[p]()}
const cOpts=(sel,all)=>(all?'<option value="">Tümü</option>':'')+courses.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${c.id==sel?'selected':''}>${esc(c.name)}</option>`).join('');
const chart=(id,type,labels,data,colors)=>charts.push(new Chart($(id),{type,data:{labels,datasets:[{data,backgroundColor:colors||'#2f6f5e',borderColor:'#2f6f5e',label:'dk'}]},options:{plugins:{legend:{display:type==='pie'}}}}));
const views={
async dash(){const [s,sc]=await Promise.all([api('GET','/stats'),api('GET','/schedules?from='+td()+'&to='+td())]);
 $('#main').innerHTML=`<div class="top"><div><h2 style="margin:0">Merhaba ${esc(U.full_name)}</h2><small>${new Date().toLocaleDateString('tr',{dateStyle:'full'})}</small></div><details><summary>Bildirimler (${s.notifs.length})</summary><div class="box">${s.notifs.map(n=>`<div>${esc(n)}</div>`).join('')||'<span class=mut>Yeni bildirim yok</span>'}</div></details></div>
 <div class="grid">${[['Bugün',fmt(s.today)],['Bu hafta',fmt(s.week)],['Tamamlanan görev',s.tasksDone],['Aktif ders',s.activeCourses]].map(([a,b])=>`<div class="box"><span class=mut>${a}</span><div class="big">${b}</div></div>`).join('')}</div>
 <div class="grid"><div class="box"><h3>Bugünün programı</h3>${sc.map(x=>`<div class="row"><span><i class="dot" style="background:${x.color}"></i>${x.start_time}–${x.end_time} ${esc(x.course_name)} <span class=mut>${esc(x.topic)}</span></span><label><input type=checkbox style="width:auto" ${x.done?'checked':''} onchange="api('PUT','/schedules/${x.id}',{toggle:this.checked})"> bitti</label></div>`).join('')||'<span class=mut>Bugün için plan yok. Program sekmesinden ekleyin.</span>'}</div>
 <div class="box"><h3>Son 7 gün</h3><canvas id="c1"></canvas></div></div>
 <div class="box"><h3>Hedef ilerlemesi</h3>${s.goals.map(g=>`<div>${esc(g.title)} (${g.period}) %${g.pct}<div class="bar"><i style="width:${g.pct}%"></i></div></div>`).join('')||'<span class=mut>Hedef yok.</span>'}</div>`;
 chart('#c1','bar',s.days.map(d=>d.date.slice(5)),s.days.map(d=>Math.round(d.seconds/60)))},
async courses(){$('#main').innerHTML=`<h2>Dersler</h2><div class="box"><div class="grid"><label>Ad<input id="n"></label><label>Kategori<input id="k"></label><label>Öğretmen<input id="t"></label><label>Hedef (dk)<input id="h" type=number></label><label>Renk<input id="c" type=color value="#2f6f5e"></label></div><label>Açıklama<input id="d"></label><button onclick="saveCourse()">Ders ekle</button> <span class=err id=e></span></div>
 <div class="box">${courses.map(c=>`<div class="row ${c.archived?'done':''}"><span><i class="dot" style="background:${c.color}"></i><b>${esc(c.name)}</b> <span class=mut>${esc(c.category||'')} ${esc(c.teacher||'')} ${c.archived?'(arşivde)':''}</span></span><span>${c.archived?`<button class=g onclick="api('PUT','/courses/${c.id}',{...${esc(JSON.stringify(c)).replace(/&quot;/g,'&quot;')},archived:0}).then(()=>go('courses'))">Geri al</button>`:`<button class=g onclick="if(confirm('Ders arşive taşınacak; notlar ve çalışma geçmişi korunur.'))api('DELETE','/courses/${c.id}').then(()=>go('courses'))">Arşivle</button>`}</span></div>`).join('')}</div>`},
async plan(){const t=new Date(),mon=new Date(t-((t.getDay()+6)%7)*864e5),f=d=>d.toLocaleDateString('sv'),end=new Date(+mon+6*864e5);
 const sc=await api('GET',`/schedules?from=${f(mon)}&to=${f(end)}`);
 $('#main').innerHTML=`<h2>Haftalık program</h2><div class="box"><div class="grid"><label>Ders<select id=pc>${cOpts()}</select></label><label>Tarih<input id=pd type=date value="${td()}"></label><label>Başlangıç<input id=ps type=time></label><label>Bitiş<input id=pe type=time></label><label>Konu<input id=pt></label><label>Öncelik<select id=pp><option>düşük<option selected>orta<option>yüksek</select></label><label>Hatırlatma (dk önce)<input id=pr type=number value=10></label></div><button onclick="saveSched()">Plan ekle</button> <span class=err id=e></span></div>
 <div class="grid">${[...Array(7)].map((_,i)=>{const d=f(new Date(+mon+i*864e5));return`<div class="box"><b>${new Date(d).toLocaleDateString('tr',{weekday:'long',day:'numeric',month:'short'})}</b>${sc.filter(x=>x.date===d).map(x=>`<div class="row ${x.done?'done':''}"><span><i class="dot" style="background:${x.color}"></i>${x.start_time}–${x.end_time}<br>${esc(x.course_name)} <span class=mut>${esc(x.topic)}</span></span><span><input type=checkbox style="width:auto" ${x.done?'checked':''} onchange="api('PUT','/schedules/${x.id}',{toggle:this.checked})"><button class="g" onclick="api('DELETE','/schedules/${x.id}').then(()=>go('plan'))">Sil</button></span></div>`).join('')||'<div class=mut>Boş</div>'}</div>`}).join('')}</div>`},
async notes(q={}){const n=await api('GET','/notes?'+new URLSearchParams(q));
 $('#main').innerHTML=`<h2>Notlar</h2><div class="box"><div class="grid"><label>Başlık<input id=nt></label><label>Ders<select id=nc><option value="">–${cOpts()}</select></label><label>Etiketler (virgülle)<input id=ng></label></div><label>İçerik<textarea id=nb rows=5></textarea></label><button onclick="saveNote()">Notu kaydet</button> <span class=err id=e></span></div>
 <div class="box"><div class="grid"><input id=sq placeholder="Ara" value="${esc(q.q||'')}"><select id=sc>${cOpts(q.course,1)}</select><input id=st placeholder="Etiket" value="${esc(q.tag||'')}"><button onclick="views.notes({q:$('#sq').value,course:$('#sc').value,tag:$('#st').value})">Filtrele</button></div></div>
 ${n.map(x=>`<div class="box"><div class="top"><b>${x.favorite?'★ ':''}${esc(x.title)}</b><span><button class=g onclick="api('PUT','/notes/${x.id}',{...${esc(JSON.stringify(x))},favorite:${x.favorite?0:1}}).then(()=>go('notes'))">Favori</button> <button class="g d" onclick="if(confirm('Not silinsin mi?'))api('DELETE','/notes/${x.id}').then(()=>go('notes'))">Sil</button></span></div><small class=mut>${esc(x.course_name||'Dersiz')} · ${esc(x.tags)} · ${x.updated_at}</small><p style="white-space:pre-wrap">${esc(x.content)}</p></div>`).join('')||'<p class=mut>Not bulunamadı.</p>'}`},
async timer(){const t=await api('GET','/timer');let pm=false;
 const draw=async()=>{const t=await api('GET','/timer');let el=t?t.elapsed:0;const render=()=>{const x=t&&t.running?el+Math.floor((Date.now()-t0)/1000):el;$('#tm').textContent=new Date(x*1000).toISOString().slice(11,19)};const t0=Date.now();render();clearInterval(tick);if(t&&t.running)tick=setInterval(render,1000);
  $('#tb').innerHTML=!t?`<button onclick="tstart()">Başlat</button>`:`${t.running?`<button onclick="api('POST','/timer/pause').then(()=>draw())">Duraklat</button>`:`<button onclick="api('POST','/timer/resume').then(()=>draw())">Devam et</button>`} <button class=d onclick="api('POST','/timer/stop').then(()=>draw())">Bitir ve kaydet</button>`;};
 window.draw=draw;window.tstart=async()=>{await api('POST','/timer/start',{course_id:$('#tc').value,topic:$('#tp').value,mode:$('#tmd').value});draw()};
 $('#main').innerHTML=`<h2>Zamanlayıcı</h2><div class="box"><div class="grid"><label>Ders<select id=tc>${cOpts(t?.course_id)}</select></label><label>Konu<input id=tp value="${esc(t?.topic||'')}"></label><label>Mod<select id=tmd><option value=serbest>Serbest<option value=pomodoro>Pomodoro (${U.pomo_work}/${U.pomo_short} dk)</select></label></div><div class="tm" id=tm>00:00:00</div><div id=tb></div><p class=mut id=pm></p></div>`;
 draw();if(t?.mode==='pomodoro'||true)setInterval&&0},
async goals(){const [s,tk]=await Promise.all([api('GET','/stats'),api('GET','/tasks')]);
 $('#main').innerHTML=`<h2>Hedefler ve görevler</h2><div class="grid"><div class="box"><h3>Yeni hedef</h3><label>Ad<input id=gt></label><label>Dönem<select id=gp><option value=daily>Günlük<option value=weekly>Haftalık<option value=monthly>Aylık</select></label><label>Süre (dk)<input id=gm type=number></label><label>Ders<select id=gc>${cOpts('',1)}</select></label><button onclick="addGoal()">Ekle</button> <span class=err id=e></span>${s.goals.map(g=>`<div class=row><span>${esc(g.title)} %${g.pct}</span><button class=g onclick="api('DELETE','/goals/${g.id}').then(()=>go('goals'))">Sil</button></div>`).join('')}</div>
 <div class="box"><h3>Yeni görev</h3><label>Ad<input id=kt></label><label>Ders<select id=kc>${cOpts('',1)}</select></label><label>Son tarih<input id=kd type=date></label><label>Öncelik<select id=kp><option>düşük<option selected>orta<option>yüksek</select></label><button onclick="addTask()">Ekle</button>${tk.map(x=>`<div class="row ${x.done?'done':''}"><span><input type=checkbox style="width:auto" ${x.done?'checked':''} onchange="api('PUT','/tasks/${x.id}',{...${esc(JSON.stringify(x))},done:this.checked?1:0}).then(()=>go('goals'))"> ${esc(x.title)} <span class=mut>${x.due_date||''}</span></span><button class=g onclick="api('DELETE','/tasks/${x.id}').then(()=>go('goals'))">Sil</button></div>`).join('')}</div></div>`},
async stats(){const s=await api('GET','/stats');$('#main').innerHTML=`<h2>İstatistik</h2><div class="grid"><div class=box><h3>Günlük (dk)</h3><canvas id=a></canvas></div><div class=box><h3>Aylık (dk)</h3><canvas id=b></canvas></div><div class=box><h3>Ders dağılımı</h3><canvas id=c></canvas></div></div><div class=box>En çok: <b>${esc(s.byCourse[0]?.name||'–')}</b> · En az: <b>${esc(s.byCourse.at(-1)?.name||'–')}</b></div>`;
 chart('#a','line',s.days.map(d=>d.date.slice(5)),s.days.map(d=>Math.round(d.seconds/60)));chart('#b','bar',s.monthly.map(m=>m.m),s.monthly.map(m=>Math.round(m.s/60)));chart('#c','pie',s.byCourse.map(c=>c.name),s.byCourse.map(c=>Math.round(c.seconds/60)),s.byCourse.map(c=>c.color))},
async prof(){$('#main').innerHTML=`<h2>Profil ve ayarlar</h2><div class=grid><div class=box><label>Ad soyad<input id=f1 value="${esc(U.full_name)}"></label><label>Kullanıcı adı<input value="${esc(U.username)}" disabled></label><label>E-posta<input id=f2 value="${esc(U.email)}"></label><label>Tema<select id=f3><option value=light>Açık<option value=dark ${U.theme=='dark'?'selected':''}>Koyu</select></label><label>Pomodoro çalışma (dk)<input id=f4 type=number value=${U.pomo_work}></label><label>Kısa mola<input id=f5 type=number value=${U.pomo_short}></label><label>Uzun mola<input id=f6 type=number value=${U.pomo_long}></label><button onclick="saveProf()">Kaydet</button> <span class=err id=e></span></div>
 <div class=box><h3>Şifre değiştir</h3><label>Mevcut<input id=p1 type=password></label><label>Yeni<input id=p2 type=password></label><button onclick="api('PUT','/me/password',{old:$('#p1').value,new:$('#p2').value}).then(()=>alert('Şifre güncellendi')).catch(e=>alert(e.message))">Güncelle</button><hr><button class=g onclick="api('POST','/logout').then(()=>location.reload())">Çıkış yap</button><h3>Hesabı sil</h3><label>Şifre<input id=p3 type=password></label><button class=d onclick="if(confirm('Hesap ve tüm veriler kalıcı olarak silinecek. Emin misiniz?'))api('DELETE','/me',{password:$('#p3').value}).then(()=>location.reload()).catch(e=>alert(e.message))">Hesabı sil</button></div></div>`}};
const E=m=>e=>($('#e').textContent=e.message);
const saveCourse=()=>api('POST','/courses',{name:$('#n').value,category:$('#k').value,teacher:$('#t').value,target_minutes:+$('#h').value,color:$('#c').value,description:$('#d').value}).then(()=>go('courses')).catch(E());
const saveSched=()=>api('POST','/schedules',{course_id:$('#pc').value,date:$('#pd').value,start_time:$('#ps').value,end_time:$('#pe').value,topic:$('#pt').value,priority:$('#pp').value,reminder:+$('#pr').value}).then(()=>go('plan')).catch(E());
const saveNote=()=>api('POST','/notes',{title:$('#nt').value,course_id:$('#nc').value,tags:$('#ng').value,content:$('#nb').value}).then(()=>go('notes')).catch(E());
const addGoal=()=>api('POST','/goals',{title:$('#gt').value,period:$('#gp').value,target_minutes:+$('#gm').value,course_id:$('#gc').value||null}).then(()=>go('goals')).catch(E());
const addTask=()=>api('POST','/tasks',{title:$('#kt').value,course_id:$('#kc').value||null,due_date:$('#kd').value,priority:$('#kp').value}).then(()=>go('goals')).catch(E());
const saveProf=()=>api('PUT','/me',{full_name:$('#f1').value,email:$('#f2').value,theme:$('#f3').value,pomo_work:$('#f4').value,pomo_short:$('#f5').value,pomo_long:$('#f6').value}).then(()=>boot()).catch(E());
boot();
</script></body></html>
